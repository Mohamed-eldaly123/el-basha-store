<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | مركز الباشّا ستور</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #d97706;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--primary); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b45309; }
        .login-box { display: block; }
        .admin-content { display: none; }
        .item-list { margin-top: 30px; }
        .item { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background: #ef4444; width: auto; padding: 5px 10px; font-size: 0.9rem; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <h2>لوحة إدارة مركز الباشّا ستور</h2>

        <!-- Login Section -->
        <div id="loginBox" class="login-box">
            <div class="form-group">
                <label>كلمة المرور للإدارة:</label>
                <input type="password" id="passInput" placeholder="أدخل كلمة المرور">
            </div>
            <button onclick="checkPass()">دخول</button>
            <p id="errorMsg" style="color: #ef4444; text-align: center; margin-top: 10px; display: none;">كلمة المرور غير صحيحة!</p>
        </div>

        <!-- Admin Controls Section -->
        <div id="adminContent" class="admin-content">
            <h3>إضافة صيانة جديدة</h3>
            <div class="form-group">
                <label>عنوان الجهاز / الصيانة:</label>
                <input type="text" id="titleInput" placeholder="مثال: صيانة كارتة شاشة / مكنسة">
            </div>
            <div class="form-group">
                <label>وصف الإصلاح والعطل:</label>
                <textarea id="descInput" rows="3" placeholder="تفاصيل العطل وما تم تغييره..."></textarea>
            </div>
            <div class="form-group">
                <label>رابط صورة الجهاز (اختياري):</label>
                <input type="text" id="imageInput" placeholder="ضع رابط الصورة أو اتركها فارغة">
            </div>
            <button onclick="addMaintenance()">حفظ ونشر للصيانة</button>

            <div class="item-list">
                <h3>الصيانات الحالية:</h3>
                <div id="itemsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AiZaSyCC1odPRZrrrODPuOMU",
            authDomain: "elbasha-store.firebaseapp.com",
            projectId: "elbasha-store",
            storageBucket: "elbasha-store.firebasestorage.app",
            messagingSenderId: "541467022635",
            appId: "1:541467022635:web:4a94e1",
            measurementId: "G-FFFHXMHV6R"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkPass() {
            const pass = document.getElementById("passInput").value;
            if(pass === "123456" || pass === "admin") { // كلمة المرور الافتراضية
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("adminContent").style.display = "block";
                loadItems();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        function addMaintenance() {
            const title = document.getElementById("titleInput").value;
            const desc = document.getElementById("descInput").value;
            const imageUrl = document.getElementById("imageInput").value;

            if(!title || !desc) {
                alert("يرجى كتابة العنوان والوصف");
                return;
            }

            db.collection("maintenances").add({
                title: title,
                description: desc,
                imageUrl: imageUrl,
                date: new Date().toLocaleDateString('ar-EG'),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تمت إضافة الصيانة بنجاح!");
                document.getElementById("titleInput").value = "";
                document.getElementById("descInput").value = "";
                document.getElementById("imageInput").value = "";
            }).catch(err => {
                alert("حدث خطأ: " + err.message);
            });
        }

        function loadItems() {
            db.collection("maintenances").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                const container = document.getElementById("itemsContainer");
                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const item = doc.data();
                    const div = document.createElement("div");
                    div.className = "item";
                    div.innerHTML = `
                        <div>
                            <strong>${item.title}</strong>
                            <br><small>${item.description}</small>
                        </div>
                        <button class="btn-delete" onclick="deleteItem('${doc.id}')">حذف</button>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function deleteItem(id) {
            if(confirm("هل أنت تأكد من حذف هذه الصيانة؟")) {
                db.collection("maintenances").doc(id).delete();
            }
        }
    </script>
</body>
</html>
